<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景漸層 (湖水藍) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- 環形光暈漸層 -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- 玻璃高光光暈 -->
    <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- 陰影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- iOS 圖標底板 (圓角矩形) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- 玻璃背景波浪/動潮紋理 -->
  <path d="M 0 320 Q 140 260 256 320 T 512 320 L 512 512 L 0 512 Z" fill="url(#glassHighlight)" opacity="0.2" />

  <!-- 外層人潮進度環 (代表 Monitoring 數據) -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="24" stroke-linecap="round" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="24" stroke-linecap="round" stroke-dasharray="880" stroke-dashoffset="240" filter="url(#shadow)" />

  <!-- 中央運動啞鈴與動潮脈衝圖標 -->
  <g filter="url(#shadow)">
    <!-- 啞鈴左邊 -->
    <rect x="176" y="216" width="24" height="80" rx="12" fill="#ffffff" />
    <!-- 啞鈴右邊 -->
    <rect x="312" y="216" width="24" height="80" rx="12" fill="#ffffff" />
    <!-- 啞鈴握把 -->
    <rect x="190" y="246" width="132" height="20" rx="10" fill="#ffffff" />
    <!-- 玻璃光澤描邊 -->
    <path d="M 176 228 Q 256 190 336 228" fill="none" stroke="url(#glassHighlight)" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
