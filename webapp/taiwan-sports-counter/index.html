<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSC台灣運動中心即時人潮</title>
    <meta name="theme-color" content="#f3f4f6" />
    <!-- 1. iOS / Safari 捷徑圖示 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- 2. Android / Chrome Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <!-- 3. 移動端狀態列與瀏覽器外框主題色（配色配合你頁面的天藍色漸層） -->
    <meta name="theme-color" content="#e0f2fe" />
    <!-- 4. iOS 網頁應用程式模式設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="動潮" />
    <style>
      /* 設定 Header 背景色並加上 iOS Safe Area Padding */
      header {
        background-color: #f3f4f6; /* 你的灰色色碼 */
        padding-top: env(safe-area-inset-top); /* 避開 iOS 瀏海與動態島 */
      }

      /* 若網頁沒有 Header，直接給 body 加上背景色 */
      body {
        background-color: #f3f4f6;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
